version: "3.8"

services:
  sabi-safe:
    build: .
    container_name: sabi-safe
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "9020:9020"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_VOICE=${GEMINI_VOICE:-Puck}
      - AUDIOSOCKET_PORT=9020
      - ENABLE_AUDIOSOCKET=true
    volumes:
      - .:/app
