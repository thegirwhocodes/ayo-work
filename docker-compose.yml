# `docker compose up` starts only the app: voice, location and in-call emergency texting (sent directly
# by the app). Everything optional is behind a profile, so nothing optional can stop the app starting:
#   --profile dev        a local pgvector Postgres (voice ID, memory, job store)
#   --profile emergency  the Agent Server path for emergency texts (needs Redis, its own Postgres and a
#                        LangSmith key/licence); also set EMERGENCY_DISPATCH=auto
#   --profile support    schema + corpus sync for the support-guidance coordinator
services:
  sabi-safe:
    build: .
    container_name: sabi-safe
    restart: unless-stopped
    networks: [default, agent-backend]
    ports:
      - "8000:8000"
      - "9020:9020"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_VOICE=${GEMINI_VOICE:-Puck}
      - GEMINI_LIVE_MODEL=${GEMINI_LIVE_MODEL:-gemini-3.1-flash-live-preview}
      - HARNESS_MODEL=${HARNESS_MODEL:-gemini-2.5-flash}
      - VOICE_ENGINE=${VOICE_ENGINE:-gemini}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_REALTIME_MODEL=${OPENAI_REALTIME_MODEL:-gpt-realtime-2.1}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID:-oC2pCZZWEDRe6lmZpaaw}
      - ELEVENLABS_MODEL=${ELEVENLABS_MODEL:-eleven_v4_turbo}
      - PHOTON_API_KEY=${PHOTON_API_KEY:-}
      - PHOTON_PROJECT_ID=${PHOTON_PROJECT_ID:-}
      - PHOTON_SENDER_ID=${PHOTON_SENDER_ID:-}
      - EMERGENCY_RESPONDER_NUMBER=${EMERGENCY_RESPONDER_NUMBER:-}
      - AUDIOSOCKET_PORT=9020
      - ENABLE_AUDIOSOCKET=true
      - DATABASE_URL=${DATABASE_URL:-postgresql://sabi:sabi_dev_password@postgres:5432/sabi_safe}
      - COHERE_API_KEY=${COHERE_API_KEY:-}
      - SUPPORT_GUIDANCE_ENABLED=${SUPPORT_GUIDANCE_ENABLED:-false}
      - SUPPORT_MEMORY_ENABLED=${SUPPORT_MEMORY_ENABLED:-false}
      - SUPPORT_MEMORY_ENCRYPTION_KEY=${SUPPORT_MEMORY_ENCRYPTION_KEY:-}
      - SUPPORT_MEMORY_IDENTITY_KEY=${SUPPORT_MEMORY_IDENTITY_KEY:-}
      - SUPPORT_MEMORY_RETENTION_DAYS=${SUPPORT_MEMORY_RETENTION_DAYS:-30}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - VOICE_VERIFICATION_THRESHOLD=${VOICE_VERIFICATION_THRESHOLD:-0.75}
      - AGENT_SERVER_URL=http://agent-server:8000
      # direct = the app sends emergency texts itself. auto = via the Agent Server (profile "emergency"),
      # falling back to a direct send if it is slow or down.
      - EMERGENCY_DISPATCH=${EMERGENCY_DISPATCH:-direct}
      # Internal-only listener (worker callback, voice reset). Bound for other containers, never published.
      - INTERNAL_HOST=0.0.0.0
      - INTERNAL_PORT=8001
      - EMERGENCY_JOB_ENCRYPTION_KEY=${EMERGENCY_JOB_ENCRYPTION_KEY:-}
      - EMERGENCY_WORKER_SECRET=${EMERGENCY_WORKER_SECRET:-}
      - AGENT_SERVER_AUTH_SECRET=${AGENT_SERVER_AUTH_SECRET:-}
      - LANGSMITH_TRACING=false
    # Each dependency is optional: it is only waited for when its profile is active.
    depends_on:
      emergency-migrate:
        condition: service_completed_successfully
        required: false
      support-init:
        condition: service_completed_successfully
        required: false
      agent-server:
        condition: service_healthy
        required: false
      postgres:
        condition: service_healthy
        required: false
  emergency-migrate:
    profiles: [emergency]
    build: .
    command: ["python", "-m", "scripts.migrate_emergency"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://sabi:sabi_dev_password@postgres:5432/sabi_safe}
      EMERGENCY_WORKER_SECRET: ${EMERGENCY_WORKER_SECRET:-}
      AGENT_SERVER_AUTH_SECRET: ${AGENT_SERVER_AUTH_SECRET:-}
      EMERGENCY_JOB_ENCRYPTION_KEY: ${EMERGENCY_JOB_ENCRYPTION_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: "no"

  # Applies the support schema, then re-chunks/re-embeds corpus sources whose
  # content digest changed. Unchanged sources are skipped.
  support-init:
    profiles: [support]
    build: .
    command: ["python", "-m", "scripts.sync_support"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://sabi:sabi_dev_password@postgres:5432/sabi_safe}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: "no"

  agent-server:
    profiles: [emergency]
    build:
      context: .
      dockerfile: Dockerfile.agent-server
    restart: unless-stopped
    networks: [agent-backend, agent-egress]
    environment:
      DATABASE_URI: ${AGENT_DATABASE_URI:-}
      REDIS_URI: ${AGENT_REDIS_URI:-redis://agent-redis:6379/0}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGGRAPH_CLOUD_LICENSE_KEY: ${LANGGRAPH_CLOUD_LICENSE_KEY:-}
      LANGSMITH_TRACING: "false"
      # The app's internal listener (never the public port 8000).
      EMERGENCY_CALLBACK_URL: http://sabi-safe:8001/internal/emergency-job
      EMERGENCY_WORKER_SECRET: ${EMERGENCY_WORKER_SECRET:-}
      AGENT_SERVER_AUTH_SECRET: ${AGENT_SERVER_AUTH_SECRET:-}
    depends_on:
      agent-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ok', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  agent-redis:
    profiles: [emergency]
    image: redis:7-alpine
    restart: unless-stopped
    networks: [agent-backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    profiles: [dev]
    image: pgvector/pgvector:pg17
    networks: [default, agent-backend]
    environment:
      POSTGRES_USER: sabi
      POSTGRES_PASSWORD: sabi_dev_password
      POSTGRES_DB: sabi_safe
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sabi -d sabi_safe"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

networks:
  agent-backend:
    internal: true
  agent-egress:
