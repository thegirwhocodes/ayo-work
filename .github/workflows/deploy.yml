# Build-check the landing page, then redeploy the whole Compose stack on the VPS.
# Required repo secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST       — e.g. 203.0.113.10
#   VPS_USER       — SSH user
#   VPS_SSH_KEY    — private key (PEM) that can log in as VPS_USER
#   VPS_APP_DIR    — absolute path to the cloned repo on the VPS, e.g. /opt/ayo-work
# Optional:
#   VPS_PORT       — SSH port (default 22)

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  frontend:
    name: Build landing page
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  deploy:
    name: Deploy Compose stack on VPS
    needs: frontend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_APP_DIR }}"
            git remote get-url origin >/dev/null
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            # Landing lives in ~/ayo-work; voice stack stays under /opt/sabi-safe.
            # Only rebuild the public site here to avoid port clashes with the existing Compose project.
            docker compose up -d --build web
            docker compose ps web
            curl -fsS -o /dev/null -w "%{http_code}\n" http://127.0.0.1:3000/
