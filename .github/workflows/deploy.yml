# Build-check the landing page, then redeploy `web` on the VPS.
# Required repo secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST       — e.g. 155.133.23.94
#   VPS_USER       — sabi
#   VPS_SSH_KEY    — private key (PEM) that can log in as VPS_USER
#   VPS_APP_DIR    — /opt/sabi-safe
# Optional:
#   VPS_PORT       — SSH port (default 22)

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  frontend:
    name: Build landing page
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  deploy:
    name: Deploy web on VPS
    needs: frontend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 10m
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            cd "$APP_DIR"
            echo "Deploying from $(pwd)"
            git remote get-url origin >/dev/null
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            # Drop any leftover container from an older Compose project name.
            docker rm -f ayo-web 2>/dev/null || true
            docker compose up -d --build --force-recreate web
            docker compose ps web
            # Next needs a beat after recreate before it accepts connections.
            for i in $(seq 1 30); do
              if code=$(curl -fsS -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/ 2>/dev/null); then
                echo "$code"
                exit 0
              fi
              echo "waiting for web ($i/30)…"
              sleep 2
            done
            echo "web did not become ready"
            docker compose logs --tail=80 web
            exit 1
